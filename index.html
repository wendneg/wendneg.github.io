<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Farmernet</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="Farmernet — student from Taiwan. Socials, local time, weather and live Discord status." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#020203;
    --surface:rgba(255,255,255,.04);
    --border:rgba(255,255,255,.09);
    --border-strong:rgba(255,255,255,.2);
    --ink:#f3f2ec;
    --muted:#8d8d95;
    --muted-2:#5a5a61;
    --accent:#57e389;
    --accent-soft:rgba(87,227,137,.45);
    --idle:#f0b232;
    --dnd:#f2555a;
    --offline:#5a5a61;
    --font:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  .bg-blobs,
  .bg-grid,
  .bg-glow{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  /* always-on ambient wash, independent of the cursor */
  .bg-blobs{
    background:
      radial-gradient(circle at 10% 6%, rgba(87,227,137,.09), transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(255,255,255,.04), transparent 45%);
  }
  /* the flashlight lives entirely in the background layer: the grid pattern
     is mostly hidden and only reveals itself in a soft circle around the
     cursor, with a small warm/green glow riding at the same spot. Neither
     layer sits above .page, so the site's actual content never dims. */
  .bg-grid{
    background-image:
      linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
    background-size:34px 34px;
    -webkit-mask-image:radial-gradient(circle 380px at var(--mx,22vw) var(--my,18vh), #000 0%, transparent 78%);
            mask-image:radial-gradient(circle 380px at var(--mx,22vw) var(--my,18vh), #000 0%, transparent 78%);
  }
  .bg-glow{
    mix-blend-mode:screen;
    background:radial-gradient(circle 260px at var(--mx,22vw) var(--my,18vh),
      rgba(255,255,255,.16) 0%,
      rgba(87,227,137,.14) 35%,
      transparent 72%);
  }
  body.no-spotlight .bg-grid{
    -webkit-mask-image:none;
    mask-image:none;
    opacity:.5;
  }
  body.no-spotlight .bg-glow{ display:none; }

  .page{
    position:relative;
    z-index:1;
    max-width:600px;
    margin:0 auto;
    padding:76px 28px 72px;
  }

  .wordmark{
    width:min(400px, 78vw);
    margin:0 0 28px -6px;
    opacity:0;
    animation:fadeUp .6s ease .18s both;
  }
  .wordmark svg{ display:block; width:100%; height:auto; }
  .wordmark svg path{ fill:var(--ink) !important; stroke:var(--ink) !important; }

  /* ---- intro ---- */
  .intro{
    font-size:18px;
    line-height:1.65;
    color:var(--ink);
    margin:0 0 30px;
    max-width:46ch;
    opacity:0;
    animation:fadeUp .6s ease .3s both;
  }
  .intro b{ font-weight:700; }
  .intro .dim{ color:var(--muted); }

  /* ---- socials: filled circular buttons, white glyphs ---- */
  .socials{
    display:flex;
    align-items:center;
    gap:20px;
    margin:0 0 34px;
    padding:0;
    list-style:none;
    opacity:0;
    animation:fadeUp .6s ease .4s both;
  }
  .icon-btn{
    color:var(--ink);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    line-height:0;
    flex:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  .icon-btn svg{ width:27px; height:27px; fill:currentColor; }
  .icon-btn:hover{ opacity:.72; transform:translateY(-1px); }
  .icon-btn:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }

  /* ---- meta: filled icon + text rows ---- */
  .meta{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin:0 0 40px;
    font-size:15px;
    color:var(--ink);
    opacity:0;
    animation:fadeUp .6s ease .5s both;
  }
  .meta-row{
    margin:0;
    display:flex;
    align-items:center;
    gap:9px;
  }
  .meta-icon{ width:15px; height:15px; flex:none; fill:var(--muted); }
  #clock{ color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:.2px; }
  #weather{ color:var(--muted); }

  /* ---- presence: floating-avatar cards, richer + chunkier ---- */
  .presence{
    display:flex;
    flex-direction:column;
    gap:20px;
    margin:0 0 46px;
    opacity:0;
    animation:fadeUp .6s ease .6s both;
  }
  .presence-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:6px;
    min-width:0;
    min-height:104px;
    background:linear-gradient(155deg, rgba(255,255,255,.06), rgba(255,255,255,.025));
    border:1px solid var(--border);
    border-radius:24px;
    padding:20px 24px 20px 100px;
    transition:border-color .2s ease, transform .2s ease, background .2s ease;
  }
  .presence-card:hover{
    border-color:var(--border-strong);
    transform:translateY(-2px);
  }
  .avatar-wrap{
    position:absolute;
    left:-50px;
    top:50%;
    transform:translateY(-50%);
    flex:none;
    width:100px;
    height:100px;
    z-index:2;
  }
  .avatar-circle{
    width:100%;
    height:100%;
    border-radius:50%;
    background:#18181b;
    box-shadow:0 10px 22px rgba(0,0,0,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .avatar-fallback{ display:flex; align-items:center; justify-content:center; }
  .avatar-fallback svg{ width:38px; height:38px; fill:var(--muted); }
  .avatar-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
  }

  /* text hierarchy: name is the loud line, status/activity are quiet supporting lines */
  .presence-info{
    display:flex;
    flex-direction:column;
    gap:6px;
    min-width:0;
  }
  .presence-name{
    margin:0;
    font-size:17px;
    font-weight:700;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .presence-status{
    margin:0;
    font-size:12px;
    font-weight:600;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:var(--muted);
  }
  .presence-status.online{ color:var(--accent); }
  .presence-status.idle{ color:var(--idle); }
  .presence-status.dnd{ color:var(--dnd); }
  .presence-status.offline{ color:var(--muted); }
  .presence-activity{
    margin:0;
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .presence-activity:empty{ display:none; }

  .status-dot{
    position:absolute;
    right:0;
    bottom:0;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--offline);
    box-shadow:0 0 0 4px var(--bg);
    transition:background .3s ease;
    z-index:3;
  }
  .status-dot.online{ background:var(--accent); box-shadow:0 0 0 4px var(--bg), 0 0 0 4px var(--accent-soft); animation:pulse 2.4s ease-out infinite; }
  .status-dot.idle{ background:var(--idle); }
  .status-dot.dnd{ background:var(--dnd); }

  /* now-playing progress bar */
  .progress{ margin-top:2px; }
  .progress-track{
    position:relative;
    height:4px;
    border-radius:2px;
    background:rgba(255,255,255,.12);
    overflow:hidden;
  }
  .progress-fill{
    position:absolute;
    inset:0 auto 0 0;
    width:0%;
    background:var(--accent);
    border-radius:2px;
  }
  .progress-time{
    display:flex;
    justify-content:space-between;
    margin-top:5px;
    font-size:11px;
    color:var(--muted-2);
    font-variant-numeric:tabular-nums;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 var(--accent-soft); }
    70%{ box-shadow:0 0 0 6px rgba(87,227,137,0); }
    100%{ box-shadow:0 0 0 0 rgba(87,227,137,0); }
  }

  @media (max-width:480px){
    .page{ padding:56px 22px 56px; }
    .intro{ font-size:16px; }
    .socials{ gap:16px; }
    .presence-card{ padding:18px 18px 18px 76px; min-height:92px; border-radius:20px; }
    .avatar-wrap{ width:78px; height:78px; left:-39px; }
    .avatar-fallback svg{ width:30px; height:30px; }
    .status-dot{ width:18px; height:18px; }
  }

  @media (prefers-reduced-motion:reduce){
    *{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
  }
</style>
</head>

<script>
  // ---- CONFIG ----------------------------------------------------------
  // Lanyard only tracks members of its own Discord server — if the status
  // below never updates at all, join https://discord.gg/lanyard with this
  // account. If online/offline works but games or Spotify never show up,
  // check on the Discord app itself:
  //   Settings → Activity Privacy → "Share your detected activities as
  //   status messages to others" must be ON (this is what feeds the
  //   "Playing <game>" line), and
  //   Settings → Connections → Spotify → "Display Spotify as your status"
  //   must be ON (this is what feeds the Spotify card).
  // Both are OFF by default on a lot of accounts.
  const DISCORD_ID = "1116705555461984298";
  const WEATHER_LAT = 25.0330, WEATHER_LON = 121.5654;
  const TIME_ZONE = "Asia/Taipei";

  // ---- Clock (ticks every second, like a proper status line) -------------
  const dateFmt = new Intl.DateTimeFormat('en-US', { timeZone: TIME_ZONE, month:'long', day:'numeric', year:'numeric' });
  const timeFmt = new Intl.DateTimeFormat('en-US', { timeZone: TIME_ZONE, hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });

  function updateClock(){
    const now = new Date();
    document.getElementById('clock').textContent = `${dateFmt.format(now)} · ${timeFmt.format(now)} GMT+8`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ---- Weather (Open-Meteo, no key required, plain text only) ------------
  const WEATHER_CODES = {
    0:'clear sky', 1:'mainly clear', 2:'broken clouds', 3:'overcast clouds',
    45:'fog', 48:'depositing rime fog',
    51:'light drizzle', 53:'drizzle', 55:'dense drizzle',
    56:'freezing drizzle', 57:'freezing drizzle',
    61:'light rain', 63:'rain', 65:'heavy rain',
    66:'freezing rain', 67:'freezing rain',
    71:'light snow', 73:'snow', 75:'heavy snow', 77:'snow grains',
    80:'rain showers', 81:'rain showers', 82:'violent rain showers',
    85:'snow showers', 86:'snow showers',
    95:'thunderstorm', 96:'thunderstorm with hail', 99:'thunderstorm with hail'
  };

  async function loadWeather(){
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&current=temperature_2m,weather_code&timezone=${encodeURIComponent(TIME_ZONE)}`;
      const res = await fetch(url);
      const data = await res.json();
      const temp = Math.round(data.current.temperature_2m);
      const desc = WEATHER_CODES[data.current.weather_code] || 'unknown conditions';
      document.getElementById('weather').textContent = `${temp}°C, ${desc} in Taiwan`;
    }catch(e){
      document.getElementById('weather').textContent = 'Weather unavailable right now';
    }
  }
  loadWeather();
  setInterval(loadWeather, 10 * 60 * 1000);

  // ---- Lanyard: live Discord presence + Spotify --------------------------
  const STATUS_LABEL = { online:'Online', idle:'Idle', dnd:'Do Not Disturb', offline:'Offline' };
  let spotifyTimestamps = null;

  function setAvatar(imgEl, url){
    if (!url){ imgEl.style.display = 'none'; imgEl.removeAttribute('src'); return; }
    imgEl.onload = () => { imgEl.style.display = 'block'; };
    imgEl.onerror = () => { imgEl.style.display = 'none'; };
    imgEl.src = url;
  }

  function formatMs(ms){
    const s = Math.max(0, Math.floor(ms / 1000));
    const m = Math.floor(s / 60);
    const sec = String(s % 60).padStart(2, '0');
    return `${m}:${sec}`;
  }

  function tickSpotifyProgress(){
    const wrap = document.getElementById('spotifyProgress');
    if (!spotifyTimestamps){ wrap.hidden = true; return; }
    const { start, end } = spotifyTimestamps;
    const total = end - start;
    const elapsed = Math.min(Math.max(Date.now() - start, 0), total);
    document.getElementById('progressFill').style.width = `${(elapsed / total) * 100}%`;
    document.getElementById('progressElapsed').textContent = formatMs(elapsed);
    document.getElementById('progressTotal').textContent = formatMs(total);
    wrap.hidden = false;
  }
  setInterval(tickSpotifyProgress, 1000);

  // pick the most useful "what they're up to" line: a custom status message
  // wins, then a game/app activity (type 0 "Playing" is preferred over
  // anything else), otherwise nothing is shown.
  function describeActivity(d){
    const activities = d.activities || [];
    const custom = activities.find(a => a.type === 4);
    if (custom && (custom.state || custom.emoji)){
      const emoji = custom.emoji && !custom.emoji.id ? `${custom.emoji.name} ` : '';
      return `${emoji}${custom.state || ''}`.trim();
    }
    const other = activities.find(a => a.type === 0) || activities.find(a => a.type !== 4 && a.type !== 2);
    if (other){
      return other.details ? `${other.name} — ${other.details}` : (other.name || '');
    }
    return '';
  }

  async function loadPresence(){
    const dot = document.getElementById('presenceDot');
    const nameEl = document.getElementById('presenceName');
    const statusEl = document.getElementById('presenceStatus');
    const activityEl = document.getElementById('presenceActivity');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const discordAvatarImg = document.getElementById('discordAvatarImg');
    const spotifyAvatarImg = document.getElementById('spotifyAvatarImg');

    try{
      const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
      const json = await res.json();
      if(!json.success) throw new Error('lanyard: user not found');
      const d = json.data;
      const status = d.discord_status || 'offline';
      const name = d.discord_user?.global_name || d.discord_user?.username || 'Farmernet';

      dot.className = 'status-dot ' + status;
      nameEl.textContent = name;
      statusEl.textContent = STATUS_LABEL[status] || 'Offline';
      statusEl.className = 'presence-status ' + status;
      activityEl.textContent = describeActivity(d);

      if (d.discord_user?.id && d.discord_user?.avatar){
        setAvatar(discordAvatarImg, `https://cdn.discordapp.com/avatars/${d.discord_user.id}/${d.discord_user.avatar}.png?size=128`);
      }

      if (d.listening_to_spotify && d.spotify){
        trackTitle.textContent = d.spotify.song;
        trackArtist.textContent = d.spotify.artist;
        spotifyTimestamps = d.spotify.timestamps || null;
        setAvatar(spotifyAvatarImg, d.spotify.album_art_url);
      } else {
        trackTitle.textContent = 'Now Listening...';
        trackArtist.textContent = '';
        spotifyTimestamps = null;
        setAvatar(spotifyAvatarImg, null);
      }
      tickSpotifyProgress();
    } catch(e){
      console.error('Lanyard presence fetch failed:', e);
      dot.className = 'status-dot offline';
      nameEl.textContent = 'Farmernet';
      statusEl.textContent = 'Offline';
      statusEl.className = 'presence-status offline';
      activityEl.textContent = '';
      trackTitle.textContent = 'Now Listening...';
      trackArtist.textContent = '';
      spotifyTimestamps = null;
      setAvatar(spotifyAvatarImg, null);
      tickSpotifyProgress();
    }
  }
  loadPresence();
  setInterval(loadPresence, 15000);

  // ---- Cursor flashlight: content stays lit only near the pointer --------
  (function(){
    const canHover = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
    if (!canHover){
      document.body.classList.add('no-spotlight');
      return;
    }
    const reduceMotion = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    const root = document.documentElement;
    let mx = window.innerWidth * 0.22, my = window.innerHeight * 0.18;
    let tx = mx, ty = my;

    window.addEventListener('pointermove', e => {
      tx = e.clientX; ty = e.clientY;
    }, { passive:true });

    function raf(){
      const ease = reduceMotion ? 1 : 0.14;
      mx += (tx - mx) * ease;
      my += (ty - my) * ease;
      root.style.setProperty('--mx', `${mx}px`);
      root.style.setProperty('--my', `${my}px`);
      requestAnimationFrame(raf);
    }
    raf();
  })();
</script>
